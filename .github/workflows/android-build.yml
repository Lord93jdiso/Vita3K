name: Android Build

on:
  push:
    branches: [android-ci]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  ANDROID_API: '28'
  NDK_VERSION: '27.2.12479018'
  # The Gradle build compiles the native library itself through externalNativeBuild and
  # packages it into an APK, so it pins its own NDK separately from the CMake-only path above.
  GRADLE_NDK_VERSION: '29.0.14206865'
  GRADLE_COMPILE_SDK: '35'

jobs:
  android-build:
    name: Android arm64-v8a
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 pkg-config

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          # The action installs "tools" by default, which no longer exists in the SDK
          # repository and makes the step fail before it gets to the NDK.
          packages: ''

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "ndk;${NDK_VERSION}"
          # The NDK version is referenced by path in later steps, so a missing or unexpected
          # path should fail here rather than deep inside cmake.
          test -f "$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"

      - name: Set up vcpkg
        env:
          VCPKG_LOCAL: ${{ github.workspace }}/vcpkg
        run: |
          # VCPKG_ROOT is not set at this point - it is only exported to later steps - so the
          # clone target has to be spelled out here.
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_LOCAL"
          "$VCPKG_LOCAL/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_LOCAL" >> $GITHUB_ENV

      - name: Install vcpkg dependencies for Android
        env:
          VCPKG_LOCAL: ${{ github.workspace }}/vcpkg
        run: |
          # Boost is installed by vcpkg (it is already listed in vcpkg.json) rather than
          # built from external/boost: the project's boost_compile() macro has no Android
          # branch and invokes b2 nowhere, so a source build silently produces nothing.
          export VCPKG_ROOT="$VCPKG_LOCAL"
          export ANDROID_NDK_ROOT
          export VCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          export VCPKG_BINARY_SOURCES="clear;x-gha,readwrite"
          "$VCPKG_LOCAL/vcpkg" install --triplet arm64-android
          ls "$VCPKG_INSTALLED_DIR/arm64-android/lib" | head

      - name: Configure
        env:
          VCPKG_LOCAL: ${{ github.workspace }}/vcpkg
        run: |
          # The Android toolchain has to be the *primary* toolchain: it is what sets
          # CMAKE_SYSTEM_NAME to Android and picks the cross compiler. Chaining it behind
          # vcpkg's toolchain left the host compiler in place, and the build configured for
          # Linux with SDL then asking for X11.
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          export VCPKG_ROOT="$VCPKG_LOCAL"
          export VCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DCMAKE_PREFIX_PATH="$VCPKG_INSTALLED_DIR/arm64-android" \
            -DCMAKE_FIND_ROOT_PATH="$VCPKG_INSTALLED_DIR/arm64-android;$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

      - name: Build
        run: cmake --build build-android --target vita3k --config Release

      - name: Upload libVita3K.so
        uses: actions/upload-artifact@v4
        with:
          name: libVita3K-arm64
          path: build-android/vita3k/libVita3K.so

  android-apk:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 pkg-config unzip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          # The action installs "tools" by default, which no longer exists in the SDK
          # repository and makes the step fail before it gets to the NDK.
          packages: ''

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-${GRADLE_COMPILE_SDK}" \
                    "build-tools;${GRADLE_COMPILE_SDK}.0.0" "ndk;${GRADLE_NDK_VERSION}"

      - name: Build APK
        run: |
          # assembleRelease recompiles libVita3K.so through externalNativeBuild rather than
          # reusing the CMake output above, which is why this is a separate job: the Gradle
          # build drives its own CMake invocation with the NDK it pins in build.gradle.
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-arm64-apk
          path: android/app/build/outputs/apk/release/*.apk