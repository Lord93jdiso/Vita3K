name: Android Build

on:
  push:
    branches: [android-ci]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  ANDROID_API: '28'
  NDK_VERSION: '27.2.12479018'

jobs:
  android-build:
    name: Android arm64-v8a
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 pkg-config

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          # The action installs "tools" by default, which no longer exists in the SDK
          # repository and makes the step fail before it gets to the NDK.
          packages: ''

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "ndk;${NDK_VERSION}"
          # The NDK version is referenced by path in later steps, so a missing or unexpected
          # path should fail here rather than deep inside cmake.
          test -f "$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"

      - name: Set up vcpkg
        env:
          VCPKG_LOCAL: ${{ github.workspace }}/vcpkg
        run: |
          # VCPKG_ROOT is not set at this point - it is only exported to later steps - so the
          # clone target has to be spelled out here.
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_LOCAL"
          "$VCPKG_LOCAL/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_LOCAL" >> $GITHUB_ENV

      - name: Describe the NDK toolchain to b2
        run: |
          # The project's boost_compile() macro never invoked b2 on Android (it only handled
          # Windows/Darwin/Linux), and b2 knows nothing about the NDK on its own, so the
          # toolchain is described here in the form the NDK documents. The "android" variant
          # is what the CMake side selects as toolset=clang-android.
          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          cat > external/boost/user-config.jam <<EOF
          using clang : android
              : "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"
              : <cxxflags>"--sysroot=$TOOLCHAIN/sysroot"
                <arch>arm
                <stripmt>true
                <linker-type>clang
                ;
          EOF
          cat external/boost/user-config.jam

      - name: Configure
        env:
          VCPKG_LOCAL: ${{ github.workspace }}/vcpkg
        run: |
          # The Android toolchain has to be the *primary* toolchain, not something chained
          # behind vcpkg: cmake/vcpkg_android.cmake includes itself at the top of the root
          # CMakeLists.txt, before project(), and the NDK toolchain is what sets
          # CMAKE_SYSTEM_NAME to Android and picks the cross compiler. Passing vcpkg's
          # toolchain as primary and chaining the NDK one leaves the host compiler in place
          # and the build silently configures for Linux.
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          export VCPKG_ROOT="$VCPKG_LOCAL"
          export VCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API}

      - name: Build
        run: cmake --build build-android --target vita3k --config Release

      - name: Upload libVita3K.so
        uses: actions/upload-artifact@v4
        with:
          name: libVita3K-arm64
          path: build-android/vita3k/libVita3K.so